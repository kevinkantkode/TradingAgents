name: CI

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py3.12)
    runs-on: ubuntu-latest
    # Single version: desk/tests use explicit ZoneInfo, not process TZ; lint/smoke already pin 3.12.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          python -m pip install --upgrade pip
          pip install .
          # Catches undeclared runtime deps: a bare install must import tradingagents
          # and tradingagents.cli.
          python -c "import tradingagents, tradingagents.cli; print('clean-install import OK')"

  lint:
    name: ruff (strict, full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16"
      - name: Lint the repository
        # The repo is fully clean under the strict select, so we lint everything
        # (generated results/ is excluded via pyproject extend-exclude).
        run: ruff check .
